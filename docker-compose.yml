services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rokoroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-roko}
      MYSQL_USER: ${MYSQL_USER:-roko}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rokopass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - roko_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rokoroot}"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: roko-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-roko}:${MYSQL_PASSWORD:-rokopass}@db:3306/${MYSQL_DATABASE:-roko}?charset=utf8mb4
      TZ: America/Sao_Paulo
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.local/share/evove:/root/.local/share/evove:ro

  cli:
    build:
      context: .
      dockerfile: apps/cli/Dockerfile
    image: roko-cli
    stdin_open: true
    tty: true
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ${HOME}/.local/share/evove:/root/.local/share/evove
      - ${HOME}/journal:/root/journal

volumes:
  roko_mysql_data:
