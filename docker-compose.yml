services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: roko-backend
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.local/share/evove:/root/.local/share/evove:ro

  cli:
    build:
      context: .
      dockerfile: apps/cli/Dockerfile
    image: roko-cli
    stdin_open: true
    tty: true
    volumes:
      - ${HOME}/.local/share/evove:/root/.local/share/evove
      - ${HOME}/journal:/root/journal
