<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page is dark by design: tell the browser before any CSS loads, so the
         first frame is black instead of the browser's default canvas (in dev,
         app.css only arrives once the JS module runs). -->
    <meta name="color-scheme" content="dark" />
    <!-- Dark Reader re-themes pages to its own dark gray (#181a1b); pure black
         is the intended look here, so opt out. -->
    <meta name="darkreader-lock" />
    <style>html, body { background: #000; }</style>
    <title>EVOVE</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
