plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

// Release signing is described by keystore.properties, which is not versioned:
// it names a keystore outside the repository and carries its passwords. It is
// the same key the Capacitor shell was signed with, so this app installs over
// it as an update.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The backend the app talks to; local.properties may point it elsewhere
// (evove.api=http://192.168.0.10:8000) for development.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def apiBase = localProperties.getProperty("evove.api", "https://api.voide.shop")

android {
    namespace = "com.evove.app"
    compileSdk = 36

    defaultConfig {
        applicationId "com.evove.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "2.0"
        buildConfigField "String", "API_BASE", "\"${apiBase}\""
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

// SoundExport writes into res/raw only when asked: -PexportSounds. Shots
// renders the screens into build/shots only when asked too: -Pshots.
tasks.withType(Test).configureEach {
    if (project.hasProperty("exportSounds")) {
        systemProperty "evove.sounds", file("src/main/res/raw").absolutePath
        outputs.upToDateWhen { false }
    }
    if (project.hasProperty("shots")) {
        systemProperty "evove.shots", layout.buildDirectory.dir("shots").get().asFile.absolutePath
        systemProperty "roborazzi.test.record", "true"
        outputs.upToDateWhen { false }
    }
    maxHeapSize = "1g"
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2025.10.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.activity:activity-compose:1.11.0"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    debugImplementation "androidx.compose.ui:ui-tooling"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.50.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.50.0"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
